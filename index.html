<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1 class="page-title">Выбери свой продукт</h1>
    <button id="highlight-first-card">Сменить цвет первой карточки</button>
    <button id="highlight-all-card">Сменить цвет всех карточек</button>
    <button id="open-google">Открыть Googl.com</button>
    <button id="output-console-log">Вывести сообщение в консоль лог</button>
    <button id="toggle-own-color">Поменять мой цвет</button>
    <div class="products-grid">
        <img src="background_dandelios.png" alt="" class="page-background">
        <template id="product-card-template">
            <div class="product-card">
                <img class="product-card__image" src="" alt="">
                <p class="product-card__category"></p>
                <h2 class="product-card__name"></h2>
                <p class="product-card__description"></p>
                <span class="product-card__ingredient-title">Состав:</span>
                <ul class="product-card__ingredient-list"></ul>
                <div class="product-card__price-block">
                    <b class="product-card__price-label">Цена:</b>
                    <span class="product-card__price-value"></span>
                </div>
            </div>
        </template>
    </div>
    <script src="main.js"></script>
    <script src="homework-7.js"></script>
    <script src="homework-8.js"></script>
    <script src="homework-9.js" type="module"></script>
    <script src="homework-10.js" type="module"></script>
    <footer class="footer">
        <div class="footer__container">
            <div class="footer__info">
                <h3 class="footer__title">Product Card</h3>
                <p class="footer__tagline">У Нас Самые Лучшие Продукты Для Кожи!</p>
                <div class="footer__social">
                    <a class="footer__social-link" href="#"><img src="VK.svg" alt="Telegram"></a>
                    <a class="footer__social-link" href="#"><img src="TG.svg" alt="VK"></a>
                </div>
            </div>
            <div class="footer__subscribe">
                <h3 class="footer__subscribe-title">Подпишись на наши акции:</h3>
                <form class="footer__form">
                    <label class="footer__label">
                        <input type="email" class="footer__input" placeholder="Введи Email...">
                    </label>
                    <button class="footer__btn" type="submit"> Подписаться </button>
                </form>
            </div>
            <div class="footer__nav">
                <h3 class="footer__nav-title">Быстрые ссылки</h3>
                <ul class="footer__menu">
                    <li class="footer__menu-item"><a href="#" class="footer__menu-link">Главная</a></li>
                    <li class="footer__menu-item"><a href="#" class="footer__menu-link">Магазин</a></li>
                    <li class="footer__menu-item"><a href="#" class="footer__menu-link">Контакты</a></li>
                </ul>
            </div>
        </div>
        <div class="footer__copyright-wrapper">
            <a href="#" class="footer__copyright">www.product-cards.com©all right reserve</a>
        </div>
    </footer>
</body>

</html>
